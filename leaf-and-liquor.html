<title>Loose Leaf Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a porcelain-and-celadon tasting notebook. A tea shelf grouped by tea family is home; each tea opens to its guide, comparisons and sessions; logging happens in one sheet with a steep-by-steep timer. */
:root{
  --bg:#EFF2EC; --surface:#FAFBF8; --surface-2:#E5EAE1; --line:#D2D9CD;
  --ink:#17201A; --ink-2:#4A574E; --ink-3:#77837A;
  --accent:#2B6855; --accent-ink:#F3F8F5; --accent-soft:#D7E8DF;
  --clay:#8C4630; --clay-soft:#F1E0D6;
  --water:#8DBFD6; --water-soft:#DCEBF2; --hot:#C4553A;
  --danger:#A13A2B;
  --s1:#2B6855; --s2:#B5552E; --s3:#4C5DA8; --s4:#9A7410; --s5:#8A3F86; --s6:#2F8A9C;
  --shadow:0 1px 2px rgba(23,32,26,.05),0 10px 30px -12px rgba(23,32,26,.18);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Songti SC",Georgia,serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#161B18; --surface-2:#1E2521; --line:#2B342F;
  --ink:#E3E9E3; --ink-2:#A9B4AC; --ink-3:#77837B;
  --accent:#7EC3A7; --accent-ink:#0D1813; --accent-soft:#1B3128;
  --clay:#DD9576; --clay-soft:#3A271F;
  --water:#4F93AE; --water-soft:#1A2C35; --hot:#E2735A; --danger:#E5806E;
  --s1:#7EC3A7; --s2:#E58B62; --s3:#93A2EE; --s4:#D9B44A; --s5:#CF8ACB; --s6:#6CC3D2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#161B18; --surface-2:#1E2521; --line:#2B342F;
  --ink:#E3E9E3; --ink-2:#A9B4AC; --ink-3:#77837B;
  --accent:#7EC3A7; --accent-ink:#0D1813; --accent-soft:#1B3128;
  --clay:#DD9576; --clay-soft:#3A271F;
  --water:#4F93AE; --water-soft:#1A2C35; --hot:#E2735A; --danger:#E5806E;
  --s1:#7EC3A7; --s2:#E58B62; --s3:#93A2EE; --s4:#D9B44A; --s5:#CF8ACB; --s6:#6CC3D2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.005em}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.fab{display:none}
@media (max-width:760px){
  .top .new-btn{display:none}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;padding:14px 20px;box-shadow:var(--shadow)}
  .tabs{order:3;width:100%;overflow-x:auto}
  .tabs button{flex:1;padding:6px 8px}
}
main{padding-block:24px 110px}
.view[hidden]{display:none}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:clamp(26px,4vw,34px)}
.page-head p{margin-top:4px;color:var(--ink-2)}

/* Common pieces */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tg{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tg.ex{background:var(--clay-soft);color:var(--clay);font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.cup{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 32%,color-mix(in srgb,var(--liq) 55%,#fff) 0,var(--liq) 48%,color-mix(in srgb,var(--liq) 75%,#000) 100%);box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line)}
.cup.lg{width:76px;height:76px}
.cup.sm{width:28px;height:28px;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.ldot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--liq);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.lstrip{display:flex;height:10px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.lstrip i{flex:1}
.score{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--clay)}
.score small{font-family:var(--f-body);font-size:11px;color:var(--ink-3);font-weight:500;margin-left:1px}
.score.none{color:var(--ink-3);font-size:14px;font-family:var(--f-body);font-weight:500}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.on{background:var(--clay);box-shadow:none}
.spark{display:flex;align-items:end;gap:2px;height:18px}
.spark i{display:block;width:4px;border-radius:1px;background:var(--accent);opacity:.75}
.bench{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.bench.ok{background:var(--accent-soft);color:var(--accent)}
.bench.off{background:var(--clay-soft);color:var(--clay)}
.bench.na{background:var(--surface-2);color:var(--ink-3)}
.empty{text-align:center;padding:56px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{color:var(--ink-2);max-width:48ch;margin:0 auto 18px}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:16px;font-size:14px;color:var(--ink-2);background:var(--surface)}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.pill{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 30px 8px 12px;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel h2{font-size:19px}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);padding:3px;border-radius:12px;width:fit-content;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.sm button{padding:4px 9px;font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.num{font-family:var(--f-mono);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .guide-row td{color:var(--ink-3);font-style:italic;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.d-up,.d-dn{font-size:10.5px;margin-left:3px;color:var(--clay)}
.swatch-key{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}

/* Charts */
.chart-svg{width:100%;height:auto;display:block}
.chart-svg text{fill:var(--ink-3);font-family:var(--f-body);font-size:11px}
.chart-svg .lbl-strong{fill:var(--ink-2);font-weight:600}
.chart-svg .grid{stroke:var(--line);fill:none}
.chart-svg .axisline{stroke:var(--ink-3);fill:none}
.chart-svg .area{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2}
.chart-svg .area2{fill:var(--clay);fill-opacity:.12;stroke:var(--clay);stroke-width:1.5;stroke-dasharray:4 3}
.chart-svg .vtx{fill:var(--accent)}
.chart-svg .band{fill:var(--accent);fill-opacity:.12}
.chart-svg .guide{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chart-svg .pt{stroke:var(--surface);stroke-width:1.5}
.chart-svg .cell{fill:var(--accent)}
.chart-svg .cell0{fill:var(--surface-2)}
.chart-svg .bar{fill:var(--accent)}
.chart-svg .tick{stroke:var(--ink);stroke-width:2}
.chart-svg .rs1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:1.8}
.chart-svg .rs2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:1.8}
.chart-svg .rs3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:1.8}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.c1{stroke:var(--s1);fill:var(--s1)}.c2{stroke:var(--s2);fill:var(--s2)}.c3{stroke:var(--s3);fill:var(--s3)}.c4{stroke:var(--s4);fill:var(--s4)}.c5{stroke:var(--s5);fill:var(--s5)}.c6{stroke:var(--s6);fill:var(--s6)}
.ln.c1,.ln.c2,.ln.c3,.ln.c4,.ln.c5,.ln.c6{fill:none}
.k1{--c:var(--s1)}.k2{--c:var(--s2)}.k3{--c:var(--s3)}.k4{--c:var(--s4)}.k5{--c:var(--s5)}.k6{--c:var(--s6)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend .li{display:inline-flex;align-items:center;gap:6px}
.legend .li i{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--c)}
.legend .li i.dash{background:none;border-top:2px dashed var(--accent);height:0}

/* Setup visual */
.setup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;display:grid;justify-items:center;align-content:start;gap:3px;text-align:center;min-width:0}
.tile .art{height:68px;display:grid;place-items:center;width:100%}
.tile .art svg{height:68px;width:auto;max-width:100%;overflow:visible;display:block}
.tile b{font-family:var(--f-mono);font-weight:500;font-size:16px;line-height:1.2}
.tile .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .nm{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.25}
.setup.mini{gap:6px}
.setup.mini .tile{padding:8px 4px;border-radius:10px;background:var(--bg)}
.setup.mini .tile .art{height:38px}
.setup.mini .tile .art svg{height:38px}
.setup.mini .tile b{font-size:13px}
@media (max-width:640px){.setup{grid-template-columns:repeat(3,minmax(0,1fr))}.setup .tile.wide{grid-column:span 2}.setup.mini .tile.wide{grid-column:auto}.setup.mini{grid-template-columns:repeat(5,minmax(0,1fr))}.setup.mini .tile .nm{display:none}}
.m-clay{fill:var(--clay-soft);stroke:var(--clay)}
.m-porcelain{fill:var(--surface);stroke:var(--ink-2)}
.m-glass{fill:var(--water-soft);stroke:var(--ink-3)}
.m-ceramic{fill:var(--surface-2);stroke:var(--ink-2)}
.vsvg *{stroke-width:2;stroke-linejoin:round}
.vsvg .nofill{fill:none}
.vsvg .liquid{fill:var(--water);stroke:none;opacity:.55}
.vsvg .matcha{fill:#7FA03A;stroke:none}
.beaker-glass{fill:var(--water-soft);stroke:var(--ink-3);stroke-width:1.6}
.beaker-water{fill:var(--water);opacity:.75}
.beaker-tick{stroke:var(--ink-3);stroke-width:1}
.thermo-tube{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.5}
.thermo-fill{fill:var(--hot)}
.thermo-band{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.leafs{stroke:rgba(0,0,0,.28);stroke-width:.6}
.plate{fill:var(--surface-2)}

/* Shelf */
.cat-jump{margin-bottom:22px}
.cat-sec{margin-bottom:28px}
.cat-sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cat-sec-head h2{font-size:21px}
.cat-sec-head .native{font-size:13px;color:var(--ink-3)}
.cat-sec-head .count{margin-left:auto;font-size:13px;color:var(--ink-3)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tea-card{display:grid;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;transition:border-color .15s;min-width:0}
.tea-card:hover{border-color:var(--ink-3)}
.tea-card .tc-top{display:flex;gap:14px;align-items:center;min-width:0}
.tea-card .tc-title{min-width:0;flex:1}
.tea-card .tc-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.tea-card .meta{font-size:13px;color:var(--ink-2)}
.tea-card .tc-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px;align-items:center}
.tea-card .tc-stats b{color:var(--ink);font-weight:600}
.tea-card .recipe{font-size:12.5px;color:var(--ink-2)}
.tea-card .tc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Tea page */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-weight:600;padding:0;margin-bottom:14px}
.tea-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tea-hero .th-title{flex:1;min-width:0}
.tea-hero h1{font-size:clamp(28px,5vw,40px);line-height:1.1;overflow-wrap:anywhere}
.tea-hero .meta{color:var(--ink-2);margin-top:6px}
.tea-hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.kstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.kstats div{background:var(--surface);padding:12px 14px}
.kstats b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.15}
.kstats span{font-size:12px;color:var(--ink-3)}
@media (max-width:560px){.kstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tea-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tea-grid > *{grid-column:1/-1}
.tea-grid > .half{grid-column:span 6}
@media (max-width:860px){.tea-grid > .half{grid-column:1/-1}}
.guide-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.guide-cols{grid-template-columns:1fr}}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.sched{display:flex;flex-wrap:wrap;gap:4px}
.sched span{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.sched span i{font-style:normal;color:var(--ink-3);margin-right:4px;font-size:10.5px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.vchips{display:flex;gap:8px;flex-wrap:wrap}
.vchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px;font-size:12.5px;background:var(--bg)}
.vchip svg{width:38px;height:28px}
.vchip.own{border-color:var(--accent)}
.vchip .own-mark{color:var(--accent);font-weight:700}
.sess-list{display:grid;gap:10px}
.sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.sess:hover{border-color:var(--ink-3)}
.sess .s-date{display:grid;justify-items:center;min-width:48px}

.sess .s-date span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sess .s-main{display:grid;gap:6px;min-width:0}
.sess .s-line{font-size:13px;color:var(--ink-2)}
.sess .s-note{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Journal (by date) */
.month{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.month h2{font-size:17px}
.month span{color:var(--ink-3);font-size:13px}
.list{display:grid;gap:8px}
.brew{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.brew:hover{border-color:var(--ink-3)}
.brew-main{min-width:0;display:grid;gap:3px}
.brew-name{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.brew-meta{color:var(--ink-2);font-size:13.5px}
.brew-params{font-size:12.5px;color:var(--ink-2)}
.brew-side{display:grid;justify-items:end;gap:6px}
.date{font-size:12px;color:var(--ink-3)}
@media (max-width:520px){.brew{grid-template-columns:auto 1fr;gap:12px}.brew-side{grid-column:1/-1;grid-template-columns:auto 1fr auto;align-items:center;justify-items:start;border-top:1px solid var(--line);padding-top:8px}.brew-side .date{justify-self:end}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.sheet{background:var(--bg);width:100%;max-width:820px;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);position:relative;margin-bottom:4vh}
@media (max-width:760px){.scrim{padding:0}.sheet{border-radius:0;min-height:100%;margin:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:3}
@media (max-width:760px){.sheet-head{border-radius:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}}
.sheet-head h2{font-size:19px;min-width:0;overflow-wrap:anywhere}
.sheet-head .sh-sub{font-size:13px;color:var(--ink-3);font-family:var(--f-body);font-weight:500}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink-2);flex:none}
.sheet-body{padding:6px 20px 20px;display:grid;gap:4px}
.sheet-foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 18px 18px;z-index:3}
.sheet-foot .hint{margin-right:auto;font-size:13px;color:var(--danger)}
.sec{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:14px}
.sec:last-child{border-bottom:0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-title h3{font-size:17px}
.sec-title .aside{font-size:12.5px;color:var(--ink-3)}
label.lbl,.lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field{display:grid;gap:5px;min-width:0}
.input,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.input:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:90px;resize:vertical;line-height:1.5}
.big-input{font-family:var(--f-display);font-size:20px;font-weight:700;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.suggest{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow-y:auto;padding:4px}
.sugg-list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.sugg-list button:hover,.sugg-list button.hi{background:var(--surface-2)}
.sugg-list .s-name{font-weight:600}
.sugg-list .s-sub{font-size:12.5px;color:var(--ink-3);margin-left:auto;text-align:right}

/* Vessel picker */
.vpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.vtile{position:relative;display:grid;justify-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px 8px;text-align:center}
.vtile svg{width:64px;height:48px}
.vtile .vn{font-size:12.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.vtile .vm{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.vtile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vtile .rec{position:absolute;top:5px;right:5px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 4px}
.vtile.add{border-style:dashed;color:var(--ink-3);font-weight:600;font-size:13px;align-content:center}
.vnote{font-size:12.5px;color:var(--ink-3)}

/* Dials */
.dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dial{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.dial-row{display:flex;align-items:center;gap:6px}
.dial-row input{width:100%;min-width:0;border:0;background:none;font-family:var(--f-mono);font-size:26px;font-weight:500;text-align:center;padding:2px 0}
.dial-row input:focus{outline:none;background:var(--surface-2);border-radius:8px}
.dial-row .u{font-size:13px;color:var(--ink-3);font-family:var(--f-mono)}
.step{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:15px;line-height:1;color:var(--ink-2);font-family:var(--f-mono)}
.step:hover{border-color:var(--ink-3)}
.dial .rng{font-size:11.5px;color:var(--ink-3);text-align:center}
.ratio-line{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2);padding:8px 12px;background:var(--surface-2);border-radius:10px}
.ratio-line b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.ratio-line .sugg{margin-left:auto;color:var(--accent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ratio-line .sugg b{color:var(--accent)}
.ratio-line .match{margin-left:auto;color:var(--ink-3)}

/* Temperature control */
.temp-box{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:10px}
.temp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.temp-read{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1}
.temp-read small{font-size:14px;color:var(--ink-3)}
.temp-rng{font-size:12.5px;color:var(--ink-3)}
.temp-steps{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.temp-steps .temp-read{min-width:4.5ch;text-align:center;font-size:40px}
.temp-scale{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.temp-scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.temp-scale button.inrec{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:var(--accent-soft);color:var(--accent)}
.temp-scale button[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.temp-type{display:flex;align-items:center;gap:10px;justify-content:center}
.temp-type input{width:120px;font-family:var(--f-mono);font-size:30px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.dial-svg{width:100%;max-width:240px;margin:0 auto;display:block;touch-action:none;cursor:grab;user-select:none}
.dial-svg:active{cursor:grabbing}
.dial-svg .trk{stroke:var(--surface-2);stroke-width:16;fill:none;stroke-linecap:round}
.dial-svg .rband{stroke:var(--accent-soft);stroke-width:16;fill:none}
.dial-svg .rband-edge{stroke:var(--accent);stroke-width:2;fill:none}
.dial-svg .val{stroke:var(--hot);stroke-width:6;fill:none;stroke-linecap:round}
.dial-svg .thumb{fill:var(--surface);stroke:var(--hot);stroke-width:4}
.dial-svg .tk{stroke:var(--ink-3);stroke-width:1.2}
.dial-svg text{fill:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.dial-svg .big{fill:var(--ink);font-size:40px;font-weight:500}
.dial-svg .u{fill:var(--ink-3);font-size:14px}
.dial-svg .rtxt{fill:var(--accent);font-family:var(--f-body);font-size:11.5px;font-weight:600}
.cold-note{font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center}

/* Infusions */
.guide-line{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.srows{display:grid;gap:6px}
.srow{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.srow.open{border-color:var(--accent)}
.srow-sum{display:grid;grid-template-columns:28px 18px 56px minmax(60px,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;text-align:left}
.srow-sum .sn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink-3);text-align:center}
.srow-sum .st{font-family:var(--f-mono);font-size:14px}
.srow-sum .sx{display:flex;gap:8px;align-items:center;justify-content:flex-end;min-width:0;font-size:12.5px;color:var(--ink-3)}
.srow-sum .sx .tg{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.gbar{position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px;opacity:.8}
.gbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
@media (max-width:560px){.srow-sum{grid-template-columns:24px 16px 50px 1fr}.srow-sum .sx{grid-column:2/-1;justify-content:flex-start}}
.srow-panel{padding:4px 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.srow-panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srow-panel .lbl{min-width:70px}
.cupscore{display:flex;gap:4px}
.cupscore button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.cupscore button.on{background:var(--clay-soft);border-color:color-mix(in srgb,var(--clay) 40%,var(--line));color:var(--clay)}
.cupscore button.sel{background:var(--clay);border-color:var(--clay);color:var(--surface)}
.now{border:1.5px solid var(--accent);background:var(--surface);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.now{grid-template-columns:1fr;justify-items:center;text-align:center}}
.now.running{box-shadow:0 0 0 4px var(--accent-soft)}
.now.over{border-color:var(--hot);box-shadow:0 0 0 4px var(--clay-soft)}
.ring{width:150px;height:150px}
.ring .rt{stroke:var(--surface-2);stroke-width:10;fill:none}
.ring .rp{stroke:var(--accent);stroke-width:10;fill:none;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.now.over .ring .rp{stroke:var(--hot)}
.ring text{font-family:var(--f-mono);fill:var(--ink)}
.ring .rbig{font-size:30px;font-weight:500}
.ring .rsub{font-size:11px;fill:var(--ink-3);font-family:var(--f-body)}
.now-ctrl{display:grid;gap:10px;min-width:0}
.now-ctrl h4{margin:0;font-family:var(--f-display);font-size:20px}
.now-ctrl .tgt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:560px){.now-ctrl .tgt,.now-ctrl .tool-row{justify-content:center}}
.now-ctrl .tgt input{width:90px;text-align:center;font-family:var(--f-mono);font-size:18px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--bg)}
.rating{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rating button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.rating button.on{background:var(--clay-soft);border-color:color-mix(in srgb,var(--clay) 40%,var(--line));color:var(--clay)}
.rating button.sel{background:var(--clay);border-color:var(--clay);color:var(--surface);font-weight:600}
.rating-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}

/* Liquor picker */
.liq-pick{display:grid;gap:8px}
.liq-typ{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.sw.s{width:22px;height:22px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.spectrum{display:flex;flex-wrap:wrap;gap:4px 3px}
.spectrum .cellw{display:grid;gap:3px;justify-items:center}
.spectrum .cellw i{display:block;width:16px;height:3px;border-radius:2px;background:transparent}
.spectrum .cellw.typ i{background:var(--accent)}
.liq-name{font-size:12.5px;color:var(--ink-2)}
.palate{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:center}
@media (max-width:560px){.palate{grid-template-columns:1fr}.palate .radar-wrap{order:-1;max-width:220px;margin:0 auto}}
.axes{display:grid;gap:8px}
.axis{display:grid;grid-template-columns:96px 1fr 22px;gap:10px;align-items:center;font-size:13.5px}

.axis small{display:block;font-size:11px;color:var(--ink-3);line-height:1.2}
.axis input{accent-color:var(--accent);width:100%}
.axis output{font-family:var(--f-mono);font-size:13px;text-align:right}
.tag-groups{display:grid;gap:8px}
.tag-group{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
@media (max-width:560px){.tag-group{grid-template-columns:1fr;gap:4px}}
.tag-group > span{font-size:12px;font-weight:600;color:var(--ink-3);padding-top:5px}
details.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline}
details.more summary::-webkit-details-marker{display:none}
details.more summary h3::after{content:" +";color:var(--ink-3);font-family:var(--f-body);font-weight:500}
details.more[open] summary h3::after{content:" −"}
.picker-list{display:grid;gap:4px}
.picker-list button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px;width:100%}
.picker-list button:hover{background:var(--surface);border-color:var(--line)}
.picker-list .pl-name{font-weight:600}
.picker-list .pl-sub{font-size:12.5px;color:var(--ink-3)}
.picker-cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:12px 0 2px 10px}

/* Detail */
.d-hero{display:flex;gap:18px;align-items:center;padding:16px 0 4px;flex-wrap:wrap}
.d-hero .d-title{flex:1;min-width:0}
.d-hero h2{font-size:clamp(22px,4vw,28px);line-height:1.15;overflow-wrap:anywhere}
.d-score .score{font-size:44px}
.tline{display:grid;gap:4px}
.tl-row{display:grid;grid-template-columns:26px 18px 60px minmax(80px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl-row:last-child{border-bottom:0}
.tl-row .n{font-family:var(--f-display);font-weight:700;color:var(--ink-3);text-align:center}
.tl-row .t{font-family:var(--f-mono)}
.tl-row .tx{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tl-note{grid-column:3/-1;font-size:13px;color:var(--ink-2);margin-top:-4px}

.notes-text{white-space:pre-wrap;line-height:1.6;max-width:65ch}
.d-cols{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
@media (max-width:620px){.d-cols{grid-template-columns:1fr}}

/* Insights + guide + settings */
.ins-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}

.ins-grid .panel.wide{grid-column:1/-1}
@media (max-width:820px){.ins-grid .panel{grid-column:1/-1}}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-3)}
.cat-rows{display:grid;gap:8px}
.cat-row{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;border:0;background:none;padding:2px 0;text-align:left}
.cat-row .nm{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .nm .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.cat-bar{height:18px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.cat-bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:4px;opacity:.85}
.cat-bar em{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink);text-shadow:0 0 3px var(--surface)}
.cat-row .avg{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--clay)}
.tagbars{display:grid;gap:6px}
.tagbar{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.tagbar .b{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.tagbar .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tagbar .v{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:right}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.gcard-top{display:flex;gap:14px;align-items:center}
.gcard h2{font-size:19px}
.gcard .native{font-size:13px;color:var(--ink-3)}

.gspecs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 0;border-block:1px solid var(--line)}
.gspecs div{display:grid}

function parseS(str){str=String(str).trim().toLowerCase();if(!str)return null;let m;

    <div class="panel"><h2>By family</h2><p class="sub">Bar shows sessions; the number is the average rating.</p><div class="cat-rows">${byCat.map(x=>`<button class="cat-row" data-a="shelfFam" data-v="${x.c.id}" style="--c:${liqHex(midLiq(x.c.liqs))}"><span class="nm"><span class="dot"></span>${x.c.name}</span><span class="cat-bar"><i style="width:${x.n/maxN*100}%"></i><em>${x.n}</em></span><span class="avg">${x.avg?x.avg.toFixed(1):'—'}</span></button>`).join('')}</div></div>

function scatter(rated){
  const X={temp:{f:b=>noTemp(b.style)?null:toU(b.temp),lab:'Water temperature ('+deg()+')',fmt:v=>v+'°'},ratio:{f:per100,lab:'Grams of leaf per 100 ml',fmt:v=>v+' g'},steeps:{f:b=>b.steeps.length||null,lab:'Number of infusions',fmt:v=>v},total:{f:b=>totalSteep(b)||null,lab:'Total steep time',fmt:fmtS}}[state.xAxis];
  const pts=rated.map(b=>({b,x:X.f(b),y:b.rating})).filter(p=>p.x!=null&&isFinite(p.x));
  if(pts.length<2)return '<p class="sub">Not enough sessions with this measurement yet.</p>';
  const W=720,H=280,pl=40,pr=16,pt=14,pb=42;let lo=Math.min(...pts.map(p=>p.x)),hi=Math.max(...pts.map(p=>p.x));if(lo===hi){lo-=1;hi+=1}
  const ticks=niceTicks(lo,hi,6),x0=ticks[0],x1=ticks[ticks.length-1];const sx=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr),sy=v=>pt+(10-v)/9*(H-pt-pb);
  let g='';[1,4,7,10].forEach(v=>g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${pl-8}" y="${sy(v)+4}" text-anchor="end">${v}</text>`);
  ticks.forEach(t=>g+=`<text x="${sx(t)}" y="${H-pb+18}" text-anchor="middle">${X.fmt(t)}</text>`);
  g+=`<line class="axisline" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/><text x="${(pl+W-pr)/2}" y="${H-4}" text-anchor="middle" class="lbl-strong">${X.lab}</text><text x="12" y="${pt+4}" class="lbl-strong">Rating</text>`;
  const seen={};pts.forEach(p=>{const k=Math.round(sx(p.x)/6)+'_'+p.y;const j=seen[k]=(seen[k]||0)+1;const dx=(j-1)*7*((j%2)?1:-1)/2;
    g+=`<circle class="pt" cx="${sx(p.x)+dx}" cy="${sy(p.y)}" r="7" style="fill:${liqHex(p.b.liq||p.b.steeps[0]?.liq||'gold')}"><title>${esc(teaName(p.b))} · ${p.b.rating}/10 · ${esc(String(X.fmt(p.x)))}</title></circle>`});
  return `<div class="tbl-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" style="min-width:480px" role="img" aria-label="Rating against ${X.lab}">${g}</svg></div>`;
}
function heatmap(all){
  const weeks=18,cell=14,gap=3;const today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-start.getDay()-(weeks-1)*7);
  const counts={};all.forEach(b=>{const d=dt(b.at);d.setHours(0,0,0,0);counts[d.getTime()]=(counts[d.getTime()]||0)+1});const max=Math.max(1,...Object.values(counts));
  let g='';const days=['S','M','T','W','T','F','S'];[1,3,5].forEach(i=>g+=`<text x="0" y="${22+i*(cell+gap)+cell-3}">${days[i]}</text>`);
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const day=new Date(start);day.setDate(start.getDate()+w*7+d);if(day>today)continue;const n=counts[day.getTime()]||0;const x=16+w*(cell+gap),y=22+d*(cell+gap);
    if(day.getDate()<=7&&d===0)g+=`<text x="${x}" y="12">${day.toLocaleDateString(undefined,{month:'short'})}</text>`;
    g+=`<rect class="${n?'cell':'cell0'}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" ${n?`style="fill-opacity:${.3+.7*n/max}"`:''}><title>${day.toDateString()}: ${n} session${n===1?'':'s'}</title></rect>`}
  const W=16+weeks*(cell+gap),H=22+7*(cell+gap);return `<div class="tbl-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" style="max-width:${W*1.6}px" role="img" aria-label="Brewing activity">${g}</svg></div>`;
}

function commitGuide(){
  const key=state.gSel,st=state.gStyle,tea=guideTea(key);const d=methodsFor(tea,{raw:true}).find(m=>m.style===st);if(!d)return;
  const num=id=>{const v=parseFloat($('#'+id)?.value);return isNaN(v)?null:v};const o={};
  if(!noTemp(st)){let a=num('ge-t0'),b=num('ge-t1');if(a!=null&&b!=null){a=clamp(fromU(a),0,100);b=clamp(fromU(b),0,100);const t=[Math.min(a,b),Math.max(a,b)].map(x=>Math.round(x));if(t.join()!==d.t.join())o.t=t}}
  let g0=num('ge-g0'),g1=num('ge-g1');if(g0!=null&&g1!=null&&g0>0){const g=[Math.min(g0,g1),Math.max(g0,g1)];if(g.join()!==d.g.join())o.g=g}
  const ml=num('ge-ml');if(ml>0&&ml!==d.ml)o.ml=Math.round(ml);
  const sc=parseSched($('#ge-sched').value);if(sc.length&&sc.join()!==d.sched.join())o.sched=sc;
  const i0=num('ge-i0'),i1=num('ge-i1');if(i0>0&&i1>0){const inf=[Math.min(i0,i1),Math.max(i0,i1)].map(Math.round);if(inf.join()!==d.inf.join())o.inf=inf}
  const all={...(store.settings.guideOverrides||{})};if(Object.keys(o).length)all[key+'|'+st]=o;else delete all[key+'|'+st];
  store.setSettings({guideOverrides:all});renderGuide();toast(Object.keys(o).length?'Guide updated':'Guide matches the default');
}

/* ═════════ Stock: how much is left ═════════ */
function stockOf(t){
  const s=t?.stock;if(!s||!(s.g>0))return null;
  const since=s.since||t.createdAt||'1970';const used=brewsOf(t.id).filter(b=>b.at>=since).reduce((a,b)=>a+(+b.g||0),0);
  const left=Math.max(0,r1(s.g-used));const per=avg(brewsOf(t.id).map(b=>+b.g||0).filter(Boolean))||recFor(t,defaultStyle(t)).gT;
  return {total:s.g,used:r1(used),left,sessionsLeft:per?Math.floor(left/per):null,price:s.price||null,cur:s.cur||'',perG:s.price?s.price/s.g:null};
}
const money = (n,cur)=>n==null?'':(cur||'')+(n<1?n.toFixed(2):n<10?n.toFixed(2):Math.round(n));
function stockHTML(t,compact){const k=stockOf(t);if(!k)return '';const pct=clamp(k.left/k.total*100,0,100);
  return `<span class="stock${k.left<=0?' out':pct<20?' low':''}" title="${k.used} g of ${k.total} g used"><span class="stock-bar"><i style="width:${pct}%"></i></span>${k.left<=0?'Used up':`${k.left} g left`}${!compact&&k.sessionsLeft!=null&&k.left>0?` · about ${k.sessionsLeft} session${k.sessionsLeft===1?'':'s'}`:''}</span>`}
function parsePrice(str){str=String(str||'').trim();if(!str)return null;const n=parseFloat(str.replace(/[^\d.]/g,''));if(isNaN(n))return null;return {price:n,cur:str.replace(/[\d.,\s]/g,'').slice(0,3)}}

/* ═════════ Library: finished teas ═════════ */
const REBUY = {yes:'Would buy again',maybe:'Maybe again',no:'Wouldn’t rebuy'};
function teaSummary(t){
  const bs=brewsOf(t.id).sort((a,b)=>dt(a.at)-dt(b.at));const rated=bs.filter(b=>b.rating);const best=rated.slice().sort((a,b)=>b.rating-a.rating||dt(b.at)-dt(a.at))[0];
  const tc={};bs.forEach(b=>sessionTags(b).forEach(x=>tc[x]=(tc[x]||0)+1));const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  return {bs,best,avg:rated.length?avg(rated.map(b=>b.rating)):null,first:bs[0]?.at,last:bs[bs.length-1]?.at,grams:r1(bs.reduce((a,b)=>a+(+b.g||0),0)),tags,score:t.verdict?.score||(best?Math.round(avg(rated.map(b=>b.rating))):null)};
}
const monthYear = iso=>iso?dt(iso).toLocaleDateString(undefined,{month:'short',year:'numeric'}):'';

  openSheet('finish',finishHTML(t,s))}

/* ═════════ Combobox (tea type, brand, origin) ═════════ */
let comboIdx=-1;
function comboOptions(kind,q){
  const n=norm(q);
  if(kind==='type'){
    const cts=(store.settings.customTypes||[]).map(c=>({v:'c:'+c.id,label:c.name,sub:famOf(c.fam).name+' · your type',fam:c.fam}));
    const lib=LIB.map(t=>({v:t.name,label:t.name,aka:t.aka,sub:famOf(t.fam).name,fam:t.fam,t}));
    if(!n)return {grouped:true,items:[...cts,...lib]};
    const sc=o=>{const a=norm(o.label),b=norm(o.aka),c=norm(o.sub),d=norm(o.t?.x.char);return a.startsWith(n)?4:b.startsWith(n)?3.5:a.includes(n)?3:b.includes(n)?2.5:(n.length>=4&&n.includes(a)&&a.length>=4)?2.2:c.includes(n)?1.5:d.includes(n)?1:0};
    return {items:[...cts,...lib].map(o=>({o,s:sc(o)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,30).map(x=>x.o)};
  }
  const list=kind==='brand'?BRANDS:LOCS;if(!n)return {items:[]};
  return {items:list.map(x=>{const k=norm(x),first=norm(x.split(',')[0]);return{x,s:first.startsWith(n)?3:k.startsWith(n)?2.5:first.includes(n)?2:k.includes(n)?1:0,len:x.length}}).filter(o=>o.s).sort((a,b)=>b.s-a.s||a.len-b.len).slice(0,8).map(o=>({v:o.x,label:o.x}))};
}
function renderCombo(input){
  const kind=input.dataset.combo,box=$('#'+input.id+'-list');if(!box)return;const {items,grouped}=comboOptions(kind,input.value);comboIdx=-1;
  if(!items.length&&kind!=='type'){box.hidden=true;return}
  const opt=o=>`<button type="button" data-a="comboPick" data-k="${kind}" data-v="${esc(o.v)}" data-for="${input.id}">${kind==='type'?`<span class="cup sm" style="--liq:${liqHex(midLiq(o.t?.x.liqs||famOf(o.fam).liqs))};width:16px;height:16px;box-shadow:none"></span>`:''}<span><span class="s-name">${esc(o.label)}</span>${o.aka?` <span class="muted" style="font-size:13px">${esc(o.aka)}</span>`:''}</span>${o.sub?`<span class="s-sub">${esc(o.sub)}</span>`:''}</button>`;
  let html='';
  if(grouped){const byFam={};items.forEach(o=>(byFam[o.fam]=byFam[o.fam]||[]).push(o));html=FAMS.filter(f=>byFam[f.id]).map(f=>`<div class="picker-cat">${f.name}</div>${byFam[f.id].map(opt).join('')}`).join('')}
  else html=items.map(opt).join('');
  if(kind==='type')html+=`<button type="button" class="combo-other" data-a="typeOther"><span class="s-name">My tea isn’t listed</span><span class="s-sub">Pick a family instead</span></button>`;
  box.innerHTML=html;box.hidden=false;
}

async function saveTeaForm(){readTeaForm();const Tt=tfType();const fam=Tt?.fam||TF.fam;
  if(!Tt&&!TF.fam){$('#tfHint').textContent='Choose the tea type, or a family if it isn’t listed.';return}
  const name=TF.name||Tt?.name;if(!name){$('#tfHint').textContent='Give the tea a name.';$('#tf-name').focus();return}

function bestLoc(s){if(!s)return '';if(LOCS.includes(s))return s;const n=norm(s);const exact=LOCS.find(l=>norm(l)===n);if(exact)return exact;
  const parts=s.split(',').map(x=>norm(x)).filter(Boolean);const cand=LOCS.filter(l=>norm(l.split(',')[0])===parts[0]);if(cand.length)return cand.sort((a,b)=>a.length-b.length)[0];return s}
function bestBrand(s){if(!s)return '';const n=norm(s);return BRANDS.find(b=>norm(b)===n)||BRANDS.find(b=>norm(b).length>=4&&(n.includes(norm(b))||norm(b).includes(n)))||s}
function heuristicParse(text){
  const out={producer:{}};const n=norm(text);let m;
  let bt=null;LIB.forEach(t=>[t.name,t.aka].forEach(x=>{const k=norm(x);if(k.length>=4&&n.includes(k)&&(!bt||k.length>bt.k))bt={t,k:k.length}}));if(bt)out.type=bt.t.name;
  let bb=null;BRANDS.forEach(b=>{const k=norm(b);if(k.length>=3&&n.includes(k)&&(!bb||k.length>bb.length))bb=b});if(bb)out.brand=bb;
  let bl=null;LOCS.forEach(l=>{const k=norm(l.split(',')[0]);if(k.length>=4&&n.includes(k)&&(!bl||l.split(',').length>bl.split(',').length))bl=l});if(bl)out.origin=bl;
  if((m=text.match(/(\d{2,3})\s*(?:°|º|degrees?)\s*([CF])\b/i))){let v=+m[1];if(m[2].toUpperCase()==='F')v=Math.round((v-32)*5/9);out.producer.temp_c=v}
  if((m=text.match(/(\d+(?:\.\d+)?)\s*(?:g|grams?)\b/i)))out.producer.grams=+m[1];
  else if((m=text.match(/(\d+(?:\.\d+)?)\s*(?:tsp|teaspoons?)/i)))out.producer.grams=r1(+m[1]*2.5);
  if((m=text.match(/(\d{2,4})\s*(?:ml|millilit(?:er|re)s?)\b/i)))out.producer.ml=+m[1];
  else if((m=text.match(/(\d+(?:\.\d+)?)\s*(?:fl\.?\s*)?oz\b/i)))out.producer.ml=Math.round(+m[1]*30);
  const times=[...text.matchAll(/(\d+(?:\.\d+)?)\s*(?:[-–]|to)?\s*(?:\d+(?:\.\d+)?)?\s*(minutes?|mins?|seconds?|secs?)\b/gi)].map(x=>Math.round(+x[1]*(/^m/i.test(x[2])?60:1))).slice(0,6);
  if(times.length)out.producer.steeps_s=times;
  if((m=text.match(/\b((?:spring|summer|autumn|fall|winter|first flush|second flush|shincha)\s+)?(20\d\d|19\d\d)\b/i)))out.harvest=(m[1]?m[1].trim().replace(/^./,c=>c.toUpperCase())+' ':'')+m[2];
  if(/gong\s?fu|gaiwan/i.test(text))out.producer.method='gongfu';else if(/kyusu/i.test(text))out.producer.method='kyusu';else if(/cold[\s-]?brew/i.test(text)&&!times.some(t=>t<3600))out.producer.method='cold';else if(times[0]>=120)out.producer.method='western';
  return out;
}

Convert °F to °C, fluid ounces to ml (1 fl oz = 30 ml), teaspoons of loose leaf to grams (1 tsp ≈ 2.5 g) and minutes to seconds. Use only what the source states; use null when something is not given.

  const a=Math.atan2(y-D.cy,x-D.cx)*180/Math.PI;let d=(a-D.a0+720)%360;if(d>D.sw)d=d>D.sw+45?0:D.sw;const c=d/D.sw*100;
  setTemp(unitF()?fromU(Math.round(toU(c))):Math.round(c))}

/* infusions */
function rSteeps(){const rec=sRec();const mx=Math.max(...S.steeps.map(s=>s.s),...rec.sched.slice(0,Math.max(1,S.steeps.length)),1);

function steepPanel(i){const s=S.steeps[i];const rec=sRec();const t=sTea();const c=famOf(t.fam);
  const sessTags=[...new Set(S.steeps.flatMap(x=>x.tags||[]))];const quick=[...new Set([...sessTags,...c.common])];
  return `<div class="srow-panel">
   <div class="row"><span class="lbl">Time</span><button type="button" class="step" data-a="stTime" data-v="${i}:-1">−</button><input class="input mono" id="st-time-${i}" data-st="time" data-i="${i}" value="${fmtS(s.s)}" style="width:96px;text-align:center"><button type="button" class="step" data-a="stTime" data-v="${i}:1">+</button>${rec.sched[i]?`<span class="muted" style="font-size:12.5px">typical ${fmtS(rec.sched[i])}</span>`:''}<button type="button" class="linkbtn danger-link" data-a="stRemove" data-v="${i}" style="margin-left:auto">Remove</button></div>
   <div class="field"><span class="lbl">Colour</span>${liqPicker(s.liq,rec.liqs,'stLiq',i,S.showAll['l'+i],typeOf(t)?.name||c.name)}</div>
   <div class="row"><span class="lbl">This cup</span><div class="cupscore">${[1,2,3,4,5].map(n=>`<button type="button" data-a="stScore" data-v="${i}:${n}" class="${s.score===n?'sel':s.score>n?'on':''}" aria-label="${n} of 5">${n}</button>`).join('')}</div><span class="muted" style="font-size:12.5px">${['','thin','fine','good','lovely','peak'][s.score||0]}</span></div>
   <div class="field"><span class="lbl">Flavours & aromas</span>
    <div class="chips">${quick.map(tg=>`<button type="button" class="chip tag" data-a="stTag" data-v="${i}" data-tag="${esc(tg)}" aria-pressed="${(s.tags||[]).includes(tg)}">${esc(tg)}</button>`).join('')}<button type="button" class="chip" data-a="stAllTags" data-v="${i}">${S.showAll['t'+i]?'Fewer':'All flavours…'}</button></div>
    ${S.showAll['t'+i]?`<div class="tag-groups" style="margin-top:6px">${FLAVORS.map(([g,ts])=>`<div class="tag-group"><span>${g}</span><div class="chips">${ts.map(tg=>`<button type="button" class="chip tag" data-a="stTag" data-v="${i}" data-tag="${esc(tg)}" aria-pressed="${(s.tags||[]).includes(tg)}">${tg}</button>`).join('')}</div></div>`).join('')}</div>`:''}
    <div class="row"><input class="input" id="st-ctag-${i}" data-st="ctag" data-i="${i}" placeholder="Add your own flavour" style="max-width:220px;padding:6px 10px"><button type="button" class="btn sm" data-a="stAddTag" data-v="${i}">Add</button>${(s.tags||[]).filter(x=>!quick.includes(x)&&!FLAVORS.some(f=>f[1].includes(x))).map(x=>`<button type="button" class="chip tag" data-a="stTag" data-v="${i}" data-tag="${esc(x)}" aria-pressed="true">${esc(x)}</button>`).join('')}</div>
   </div>
   <div class="field"><label class="lbl" for="st-note-${i}">Note</label><input class="input" id="st-note-${i}" data-st="note" data-i="${i}" value="${esc(s.note||'')}" placeholder="What changed in this cup?"></div>
  </div>`}
function liqPicker(sel,typical,act,i,all,teaNm){
  return `<div class="liq-pick"><div class="liq-typ">${typical.map(id=>`<button type="button" class="sw" style="--c:${liqHex(id)}" data-a="${act}" data-v="${i}" data-liq="${id}" aria-pressed="${sel===id}" title="${LIQM[id].n}" aria-label="${LIQM[id].n}"></button>`).join('')}<span class="liq-name">${sel?`<b>${LIQM[sel].n}</b>${typical.includes(sel)?'':' · outside the typical range'}`:'Typical for '+esc(teaNm)}</span><button type="button" class="linkbtn" data-a="liqAll" data-v="${i}" style="font-size:12.5px;margin-left:auto">${all?'Hide spectrum':'Full spectrum'}</button></div>
  ${all?`<div class="spectrum">${LIQ.map(([id,n,h])=>`<span class="cellw ${typical.includes(id)?'typ':''}"><button type="button" class="sw s" style="--c:${h}" data-a="${act}" data-v="${i}" data-liq="${id}" aria-pressed="${sel===id}" title="${n}" aria-label="${n}"></button><i></i></span>`).join('')}</div><span class="vnote">Underlined: typical range for this tea.</span>`:''}</div>`}
function rNow(){
  const el=$('#sf-now');const n=S.steeps.length+1;const rec=sRec();const run=T.run;const C=2*Math.PI*62;
  el.innerHTML=`<div class="now ${run?'running':''}" id="nowBox">
   <svg class="ring" viewBox="0 0 150 150" aria-hidden="true"><circle class="rt" cx="75" cy="75" r="62"/><circle class="rp" id="ringP" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 75 75)"/>
    <text class="rbig" id="ringT" x="75" y="80" text-anchor="middle">${fmtClock(S.target)}</text><text class="rsub" id="ringS" x="75" y="102" text-anchor="middle">${run?'steeping':'target'}</text></svg>
   <div class="now-ctrl"><h4>Infusion ${n}${n===1&&S.rinse?' <span class="muted" style="font-size:13px;font-family:var(--f-body);font-weight:500">after rinse</span>':''}</h4>
    ${run?`<p class="sub">Pour off when the ring completes. Stopping logs the actual time.</p><div class="tool-row"><button type="button" class="btn primary lg" data-a="tStop">Stop & log</button><button type="button" class="btn ghost" data-a="tCancel">Cancel</button></div>`
    :`<div class="tgt"><span class="lbl">Target</span><button type="button" class="step" data-a="tgtAdj" data-v="-1">−</button><input id="tgtIn" value="${fmtS(S.target)}" aria-label="Target steep time"><button type="button" class="step" data-a="tgtAdj" data-v="1">+</button><span class="muted" style="font-size:12.5px">${rec.sched[n-1]?'typical '+fmtS(rec.sched[n-1]):'past the typical schedule'}</span></div>
     <div class="tool-row"><button type="button" class="btn primary lg" data-a="tStart">▶ Start</button><button type="button" class="linkbtn" data-a="logNoTimer">or log ${fmtS(S.target)} without timing</button></div>`}
   </div></div>`;
  if(run)tTick();
}

/* timer */
const T={run:false,t0:0,target:0,iv:null,chimed:false,ctx:null,lock:null};
function tStart(){T.run=true;T.t0=performance.now();T.target=S.target;T.chimed=false;
  try{T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)();T.ctx.resume?.()}catch{}
  try{navigator.wakeLock?.request('screen').then(l=>T.lock=l).catch(()=>{})}catch{}
  T.iv=setInterval(tTick,100);rNow()}
const tElapsed=()=>(performance.now()-T.t0)/1000;
function tTick(){if(!T.run)return;const e=tElapsed();const C=2*Math.PI*62;const p=$('#ringP'),tt=$('#ringT'),ss=$('#ringS'),box=$('#nowBox');if(!p)return;
  const rem=T.target-e;p.setAttribute('stroke-dashoffset',C*(1-clamp(e/T.target,0,1)));
  if(rem>0){tt.textContent=fmtClock(Math.ceil(rem));ss.textContent='steeping · '+fmtS(Math.floor(e))}else{tt.textContent='+'+fmtClock(-rem);ss.textContent='pour now · '+fmtS(Math.floor(e));box.classList.add('over')}
  if(!T.chimed&&e>=T.target){T.chimed=true;chime()}}
function tStop(log){clearInterval(T.iv);const e=Math.max(1,Math.round(tElapsed()));T.run=false;try{T.lock?.release()}catch{}T.lock=null;if(log)logSteep(e);else if(S)rNow()}
function chime(){try{const c=T.ctx;if(!c)return;[0,.22,.44].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=i===2?1046:784;o.connect(g);g.connect(c.destination);const t=c.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.start(t);o.stop(t+.45)})}catch{}try{navigator.vibrate?.([120,80,120])}catch{}}
function logSteep(sec){const rec=sRec();const prev=S.steeps[S.steeps.length-1];
  S.steeps.push({s:sec,liq:prev?.liq||midLiq(rec.liqs),score:0,tags:[],note:''});S.open=S.steeps.length-1;S.target=nextTarget();
  rSteeps();rNow();rVisual();toast(`Infusion ${S.steeps.length} logged: ${fmtS(sec)}`);
  setTimeout(()=>$$('.srow')[S.open]?.scrollIntoView({block:'nearest',behavior:'smooth'}),30)}
function readSF(){const v=id=>$('#'+id)?.value.trim()??'';S.notes=$('#sf-notes').value;S.rinse=$('#sf-rinse').checked;const at=v('sf-at');if(at){const d=new Date(at);if(!isNaN(d))S.at=d.toISOString()}}
async function saveSession(){
  readSF();if(T.run)tStop(true);
  const t=sTea();const v=vesselOf(S);
  const b={teaId:t.id,tea:t.name,cat:t.fam,at:S.at,style:S.style,vesselId:S.vesselId||'',vesselType:v.type,vesselName:v.name,g:+S.g||0,ml:+S.ml||0,temp:noTemp(S.style)?null:+S.temp,rinse:!!S.rinse,
    steeps:S.steeps.map(s=>({s:s.s,liq:s.liq||'',score:s.score||0,tags:s.tags||[],note:s.note||''})),rating:S.rating||0,axes:S.axes,notes:S.notes||'',water:S.water||'',liq:S.steeps[0]?.liq||'',tags:[...new Set(S.steeps.flatMap(s=>s.tags||[]))],id:S.id};
  if(S.editing&&S.example)b.example=true;
  const btn=$('[data-a="saveSession"]');btn.disabled=true;btn.textContent='Saving…';
  try{await store.saveBrew(b);const wasEdit=S.editing;closeSheet();toast(wasEdit?'Changes saved':'Session saved');if(state.view!=='tea'||state.teaId!==t.id)setView('tea',{teaId:t.id});else renderTea()}
  catch(e){btn.disabled=false;btn.textContent=S.editing?'Save changes':'Save session';$('#sfHint').textContent=e?.code==='quota_exceeded'?'Storage is full. Delete some old sessions to make room.':'Could not save. Check your connection and try again.'}
}

    data=[cols.join(',')].concat(store.brews.map(b=>{const t=teaById(b.teaId)||{};return[b.at,t.name,typeOf(t)?.name||'',famOf(t.fam).name,t.brand,t.origin,t.harvest,STYLE[b.style],vesselOf(b).name,b.g,b.ml,b.temp,b.steeps.length,b.steeps.map(s=>s.s).join(' '),b.rating||'',sessionTags(b).join('; '),b.notes].map(q).join(',')})).join('\n');filename='loose-leaf-sessions.csv'}

});
function confirmLeave(el){if(!S.steeps.length&&!S.editing)return true;return arm(el,'Leave without saving?')}
function addStepTag(i){const inp=$('#st-ctag-'+i);const val=inp.value.trim().toLowerCase();if(!val)return;const s=S.steeps[i];s.tags=s.tags||[];if(!s.tags.includes(val))s.tags.push(val);rSteeps();setTimeout(()=>$('#st-ctag-'+i)?.focus(),0)}
$('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim'&&['session','picker'].includes($('#scrim').dataset.kind))closeSheet()});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.combo){if(TF&&t.dataset.combo!=='type'){TF[t.dataset.combo]=t.value;const n=$('#tf-'+t.dataset.combo+'-note');if(n)n.innerHTML=validNote(t.dataset.combo,t.value)}renderCombo(t);return}
  if(t.id==='shelfQ'){state.q=t.value;clearTimeout(renderShelf._t);renderShelf._t=setTimeout(renderShelf,120);return}
  if(t.id==='jq'){state.jq=t.value;clearTimeout(renderJournal._t);renderJournal._t=setTimeout(renderJournal,120);return}
  if(t.id==='pickQ'){renderPickList();return}
  if(t.id==='libQ'){state.libQ=t.value;clearTimeout(renderLibrary._t);renderLibrary._t=setTimeout(renderLibrary,120);return}
  if(t.id==='gq'){state.gq=t.value;$('#glItems').innerHTML=guideListHTML();return}
  if(t.dataset.w){const id=t.dataset.id;store.setSettings({vessels:store.settings.vessels.map(x=>x.id===id?{...x,[t.dataset.w]:t.dataset.w==='ml'?(parseInt(t.value)||0):t.value}:x)});return}
  if(t.dataset.ct){const id=t.dataset.id,k=t.dataset.ct;store.setSettings({customTypes:(store.settings.customTypes||[]).map(c=>{if(c.id!==id)return c;if(k==='name')return{...c,name:t.value};if(k==='fam')return{...c,fam:t.value};const lo=parseFloat($('#ctl-'+id).value),hi=parseFloat($('#cth-'+id).value);return{...c,t:!isNaN(lo)&&!isNaN(hi)?[Math.min(lo,hi),Math.max(lo,hi)]:null}})});return}
  if(!S)return;
  if(t.id==='sf-g'||t.id==='sf-ml'){const k=t.id.slice(3);const n=parseFloat(t.value);if(!isNaN(n)){S[k]=n;S.touched.add(k);rRatio();rVisual()}return}
  if(t.id==='tType'){const n=parseFloat(t.value);if(!isNaN(n)){S.temp=clamp(fromU(n),0,100);S.touched.add('temp');rRatio();rVisual()}return}
  if(t.dataset.axis){const k=t.dataset.axis;S.axes[k]=+t.value;$('#axo-'+k).textContent=t.value==='0'?'–':t.value;$('#sf-radar').innerHTML=radarSVG([{v:S.axes}],{size:190});return}
  if(t.dataset.st==='note'){S.steeps[+t.dataset.i].note=t.value;return}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset?.combo==='type')renderCombo(t)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='jmin'){state.jmin=+t.value;renderJournal();return}
  if(t.id==='libRebuy'){state.libRebuy=t.value;renderLibrary();return}
  if(t.id==='libSort'){state.libSort=t.value;renderLibrary();return}
  if(t.dataset.ge!=null){commitGuide();return}
  if(t.dataset.ct==='fam'){t.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(t.id==='im-photo'){const f=t.files?.[0];$('#im-photo-name').textContent=f?f.name:'';return}
  if(!S)return;
  if(t.id==='sf-g'||t.id==='sf-ml')rDials();
  if(t.id==='sf-rinse'){S.rinse=t.checked;rNow();rVisual()}
  if(t.dataset.st==='time'){const p=parseS(t.value);const s=S.steeps[+t.dataset.i];if(p){s.s=p}rSteeps();rVisual()}
  if(t.id==='tgtIn'){const p=parseS(t.value);if(p)S.target=p;rNow()}
  if(t.id==='tType')rTemp();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&!$('#scrim').hidden){const open=$$('.sugg-list').find(b=>!b.hidden);if(open){open.hidden=true;return}if(!['form','tea'].includes($('#scrim').dataset.kind))closeSheet();return}
  if(t.dataset?.combo){const box=$('#'+t.id+'-list');const items=box&&!box.hidden?$$('button',box):[];
    if(items.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();comboIdx=(comboIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('hi',i===comboIdx));items[comboIdx].scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'){e.preventDefault();if(items.length&&(comboIdx>=0||t.dataset.combo==='type'))items[Math.max(0,comboIdx)].click();else hideCombos();return}}
  if(t.id==='tdial'&&S){const map={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:5,PageDown:-5};if(map[e.key]){e.preventDefault();setTemp(fromU(toU(S.temp)+map[e.key]))}return}
  if(t.dataset?.st==='ctag'&&e.key==='Enter'){e.preventDefault();addStepTag(+t.dataset.i);return}
  if(t.id==='tgtIn'&&e.key==='Enter'){e.preventDefault();t.blur();return}
  if(t.dataset?.ge!=null&&e.key==='Enter'){e.preventDefault();t.blur();return}
  if(t.closest?.('#sForm,#teaForm')&&e.key==='Enter'&&t.tagName==='INPUT'){e.preventDefault();t.blur()}
});
document.addEventListener('focusout',e=>{if(e.target.dataset?.combo)setTimeout(()=>{const box=$('#'+e.target.id+'-list');if(box&&!box.contains(document.activeElement))box.hidden=true},180)});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('mousedown',e=>{if(e.target.closest('.sugg-list'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{const d=e.target.closest('#tdial');if(!d||!S)return;e.preventDefault();d.setPointerCapture(e.pointerId);d._drag=true;dialFromEvent(e)});
document.addEventListener('pointermove',e=>{const d=$('#tdial');if(d&&d._drag)dialFromEvent(e)});
document.addEventListener('pointerup',()=>{const d=$('#tdial');if(d)d._drag=false});
document.addEventListener('pointercancel',()=>{const d=$('#tdial');if(d)d._drag=false});

renderView();
store.init();
</script>
